---
# base-host role tasks

- name: Detect OS family for variable loading
  ansible.builtin.set_fact:
    base_host_vars_file: >-
      {%- if ansible_distribution in ['Debian', 'Raspbian', 'Raspberry Pi OS'] -%}
      Debian
      {%- elif ansible_distribution in ['Fedora', 'RedHat', 'CentOS', 'Rocky', 'AlmaLinux'] -%}
      Fedora
      {%- else -%}
      {{ ansible_distribution }}
      {%- endif -%}
  tags: always

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ base_host_vars_file }}.yml"
  tags: always

- name: Update package cache (Debian-based)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'
  tags: packages

- name: Install base system packages
  ansible.builtin.package:
    name: "{{ base_host_packages_common + base_host_packages }}"
    state: present
  tags: packages

- name: Configure system timezone
  community.general.timezone:
    name: "{{ base_host_timezone }}"
  notify: restart systemd-timesyncd

- name: Check current system locale
  ansible.builtin.command:
    cmd: localectl status
  register: current_locale
  changed_when: false
  failed_when: false
  when: ansible_os_family == 'Debian'

- name: Check if locale needs to be set
  ansible.builtin.set_fact:
    locale_needs_update: >-
      {{ ansible_os_family == 'Debian' and 
         (current_locale.skipped is not defined or not current_locale.skipped) and
         (current_locale.rc != 0 or base_host_locale not in current_locale.stdout) }}

- name: Configure system locale via localectl
  ansible.builtin.command:
    cmd: localectl set-locale LANG={{ base_host_locale }}
  become: true
  register: localectl_result
  failed_when: false
  when:
    - locale_needs_update | bool
    - current_locale.rc == 0

- name: Configure system locale via /etc/default/locale (fallback)
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: 'LANG={{ base_host_locale }}'
    create: true
    mode: '0644'
  become: true
  when:
    - locale_needs_update | bool
    - current_locale.rc != 0 or (localectl_result is defined and localectl_result.rc != 0)

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ base_host_log_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: base_host_logging_enabled

- name: Configure sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-keystone.conf
    reload: true
  loop:
    - { key: 'vm.swappiness', value: '10' }
    - { key: 'fs.file-max', value: '2097152' }
    - { key: 'net.core.somaxconn', value: '65535' }
  when: base_host_configure_sysctl
  tags: sysctl

- name: Disable IPv6 (if configured)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-keystone-ipv6.conf
    reload: true
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
  when: base_host_disable_ipv6
  tags: sysctl

- name: Ensure systemd-timesyncd is enabled
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
