---
# storage-primitives role tasks
# This role is OPTIONAL - only runs if keystone_storage is defined in inventory

- name: Check if custom storage is configured
  ansible.builtin.set_fact:
    storage_enabled: "{{ keystone_storage is defined and keystone_storage.ssd_device is defined }}"
  tags: always

- name: Display storage configuration status
  ansible.builtin.debug:
    msg: "{{ 'Custom storage configured - managing devices' if storage_enabled else 'No custom storage - using system defaults' }}"
  tags: always

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"
  when: storage_enabled
  tags: always

- name: Install storage management packages
  ansible.builtin.package:
    name: "{{ storage_packages }}"
    state: present
  when: storage_enabled
  tags: packages

- name: Check if RAID devices exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: raid_device_check
  loop: "{{ keystone_storage.backup_devices }}"
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
  tags: storage

- name: Check for existing mdadm metadata on backup devices
  ansible.builtin.command:
    cmd: mdadm --examine {{ item }}
  register: mdadm_examine
  loop: "{{ keystone_storage.backup_devices }}"
  failed_when: false
  changed_when: false
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
  tags: storage

- name: Check if RAID array already exists
  ansible.builtin.stat:
    path: "{{ storage_raid_device }}"
  register: raid_array_stat
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
  tags: storage

- name: Create RAID array for backup storage
  ansible.builtin.command:
    cmd: >
      mdadm --create {{ storage_raid_device }}
      --level={{ storage_raid_level }}
      --raid-devices={{ keystone_storage.backup_devices | length }}
      --metadata={{ storage_raid_metadata_version }}
      --assume-clean
      {{ keystone_storage.backup_devices | join(' ') }}
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
    - not raid_array_stat.stat.exists
    - raid_device_check.results | selectattr('stat.exists') | list | length == keystone_storage.backup_devices | length
    - mdadm_examine.results | selectattr('rc', 'equalto', 0) | list | length == 0
  tags: storage

- name: Generate mdadm configuration
  ansible.builtin.shell:
    cmd: mdadm --detail --scan
  register: mdadm_scan
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
  changed_when: false
  tags: storage

- name: Update mdadm configuration file
  ansible.builtin.copy:
    content: "{{ mdadm_scan.stdout }}\n"
    dest: "{{ storage_mdadm_config }}"
    mode: '0644'
    owner: root
    group: root
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
  notify: update initramfs
  tags: storage

- name: Check if SSD has existing filesystem
  ansible.builtin.command:
    cmd: blkid {{ keystone_storage.ssd_device }}
  register: ssd_blkid
  failed_when: false
  changed_when: false
  when: storage_enabled
  tags: storage

- name: Create filesystem on SSD (new device)
  community.general.filesystem:
    fstype: "{{ storage_ssd_fstype }}"
    dev: "{{ keystone_storage.ssd_device }}"
    opts: -L keystone-ssd
    force: false
  when:
    - storage_enabled
    - ssd_blkid.rc != 0
  tags: storage

- name: Verify SSD filesystem label
  ansible.builtin.command:
    cmd: blkid -s LABEL -o value {{ keystone_storage.ssd_device }}
  register: ssd_label_check
  failed_when: false
  changed_when: false
  when: storage_enabled
  tags: storage

- name: Create filesystem on SSD (wrong or missing label)
  community.general.filesystem:
    fstype: "{{ storage_ssd_fstype }}"
    dev: "{{ keystone_storage.ssd_device }}"
    opts: -L keystone-ssd
    force: true
  when:
    - storage_enabled
    - ssd_blkid.rc == 0
    - ssd_label_check.stdout != 'keystone-ssd'
  tags: storage

- name: Re-verify SSD filesystem label after creation
  ansible.builtin.command:
    cmd: blkid -s LABEL -o value {{ keystone_storage.ssd_device }}
  register: ssd_label_final
  failed_when: false
  changed_when: false
  when: storage_enabled
  tags: storage

- name: Display SSD filesystem information
  ansible.builtin.debug:
    msg: |
      SSD Device: {{ keystone_storage.ssd_device }}
      Filesystem exists: {{ ssd_blkid.rc == 0 }}
      Current label: {{ ssd_label_final.stdout if ssd_label_final.rc == 0 else 'none' }}
      Expected label: keystone-ssd
  when: storage_enabled
  tags: storage

- name: Check if RAID array has existing filesystem
  ansible.builtin.command:
    cmd: blkid {{ storage_raid_device }}
  register: raid_blkid
  failed_when: false
  changed_when: false
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
  tags: storage

- name: Create filesystem on RAID array
  community.general.filesystem:
    fstype: "{{ storage_backup_fstype }}"
    dev: "{{ storage_raid_device }}"
    opts: -L keystone-backup
    force: false
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
    - raid_blkid.rc != 0
  tags: storage

- name: Validate storage configuration
  ansible.builtin.assert:
    that:
      - keystone_storage.ssd_device is defined
      - keystone_storage.ssd_mount is defined
      - keystone_storage.backup_mount is defined
      - keystone_storage.ssd_device | length > 0
      - keystone_storage.ssd_mount | length > 0
    fail_msg: "keystone_storage is defined but incomplete. Required: ssd_device, ssd_mount, backup_mount"
  when: storage_enabled
  tags: storage

- name: Create mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - "{{ keystone_storage.ssd_mount }}"
    - "{{ keystone_storage.backup_mount }}"
  when: storage_enabled
  tags: storage

- name: Create systemd mount unit for SSD
  ansible.builtin.template:
    src: mount-unit.j2
    dest: "/etc/systemd/system/{{ keystone_storage.ssd_mount[1:] | replace('/', '-') }}.mount"
    mode: '0644'
  vars:
    mount_what: "LABEL=keystone-ssd"
    mount_where: "{{ keystone_storage.ssd_mount }}"
    mount_type: "{{ storage_ssd_fstype }}"
    mount_options: "{{ storage_ssd_mount_opts }}"
  when: storage_enabled
  notify: reload systemd
  tags: storage

- name: Enable and start SSD mount
  ansible.builtin.systemd:
    name: "{{ keystone_storage.ssd_mount[1:] | replace('/', '-') }}.mount"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - storage_enabled
    - ssd_label_final.rc == 0
    - ssd_label_final.stdout == 'keystone-ssd'
  tags: storage

- name: Warning if SSD filesystem label is incorrect
  ansible.builtin.fail:
    msg: |
      SSD filesystem label mismatch!
      Device: {{ keystone_storage.ssd_device }}
      Current label: {{ ssd_label_final.stdout if ssd_label_final.rc == 0 else 'none' }}
      Expected label: keystone-ssd
      
      This should not happen - the playbook attempted to create the filesystem
      but the label is still incorrect. Please check:
      
      1. Verify device path is correct in inventory
      2. Check if device is read-only: mount | grep {{ keystone_storage.ssd_device }}
      3. Try manually: sudo mkfs.xfs -f -L keystone-ssd {{ keystone_storage.ssd_device }}
  when:
    - storage_enabled
    - ssd_label_final.stdout != 'keystone-ssd'
  tags: storage

- name: Create systemd mount unit for backup
  ansible.builtin.template:
    src: mount-unit.j2
    dest: "/etc/systemd/system/{{ keystone_storage.backup_mount[1:] | replace('/', '-') }}.mount"
    mode: '0644'
  vars:
    mount_what: "LABEL=keystone-backup"
    mount_where: "{{ keystone_storage.backup_mount }}"
    mount_type: "{{ storage_backup_fstype }}"
    mount_options: "{{ storage_backup_mount_opts }}"
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
  notify: reload systemd
  tags: storage

- name: Enable and start backup mount
  ansible.builtin.systemd:
    name: "{{ keystone_storage.backup_mount[1:] | replace('/', '-') }}.mount"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - storage_enabled
    - storage_raid_enabled
    - keystone_storage.backup_devices is defined
  tags: storage

- name: Enable and start SMART monitoring
  ansible.builtin.systemd:
    name: smartd
    enabled: true
    state: started
  when:
    - storage_enabled
    - storage_smart_enabled
  tags: storage

- name: Enable and start mdmonitor
  ansible.builtin.systemd:
    name: mdmonitor
    enabled: true
    state: started
  when:
    - storage_enabled
    - storage_raid_enabled
    - storage_mdmonitor_enabled
    - keystone_storage.backup_devices is defined
  tags: storage
