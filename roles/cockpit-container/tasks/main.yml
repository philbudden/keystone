---
# cockpit-container role tasks

- name: Check if custom SSD mount is defined and exists
  ansible.builtin.stat:
    path: "{{ keystone_storage.ssd_mount }}"
  register: ssd_mount_check
  when: keystone_storage.ssd_mount is defined
  tags: cockpit

- name: Verify custom SSD is mounted (if configured)
  ansible.builtin.assert:
    that:
      - ssd_mount_check.stat.exists
      - ssd_mount_check.stat.isdir
    fail_msg: "Custom SSD mount point {{ keystone_storage.ssd_mount }} is configured but does not exist. Either run storage-primitives role or remove keystone_storage from inventory."
  when:
    - keystone_storage.ssd_mount is defined
    - ssd_mount_check is defined
  tags: cockpit

- name: Create Cockpit directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - "{{ cockpit_config_dir }}"
    - "{{ cockpit_data_dir }}"
  tags: cockpit

- name: Pull Cockpit container image
  containers.podman.podman_image:
    name: "{{ cockpit_full_image }}"
    state: present
  tags: cockpit

- name: Create Cockpit systemd unit
  ansible.builtin.template:
    src: cockpit.service.j2
    dest: "/etc/systemd/system/{{ cockpit_systemd_unit }}"
    mode: '0644'
    owner: root
    group: root
  notify:
    - reload systemd
    - restart cockpit
  tags: cockpit

- name: Enable and start Cockpit service
  ansible.builtin.systemd:
    name: "{{ cockpit_systemd_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  tags: cockpit

- name: Configure firewall for Cockpit
  ansible.posix.firewalld:
    zone: trusted
    port: "{{ cockpit_port }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: tailscale_firewall_enabled | default(true)
  tags: 
    - cockpit
    - firewall

- name: Display Cockpit access information
  ansible.builtin.debug:
    msg: |
      Cockpit is now available at:
      https://{{ ansible_default_ipv4.address }}:{{ cockpit_port }}
      
      Access via Tailscale only (tailnet-restricted)
  tags: cockpit
