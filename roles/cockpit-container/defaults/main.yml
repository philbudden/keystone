---
# cockpit-container role: Containerized Cockpit web interface

# Container image (pinned to specific digest)
cockpit_image: "quay.io/cockpit/ws"
cockpit_image_tag: "324"
cockpit_image_digest: "sha256:f24b5c23f5e0b3d1f0e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5"  # TODO: Replace with actual digest
cockpit_use_digest: false  # Set to true once digest is obtained
cockpit_full_image: "{{ cockpit_image }}:{{ cockpit_image_tag }}"

# Network configuration (tailnet-only)
cockpit_port: 9090
cockpit_bind_address: "0.0.0.0"  # Firewall restricts to tailnet

# Storage
cockpit_config_dir: /etc/cockpit
cockpit_data_dir: "{{ keystone_storage.ssd_mount }}/cockpit"

# Systemd unit
cockpit_systemd_unit: cockpit.service
