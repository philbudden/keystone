---
# cockpit-container role: Containerized Cockpit web interface

# Container image
# Note: Using 'latest' tag for now. For production, pin to a specific version.
# Available tags: https://quay.io/repository/cockpit/ws?tab=tags
# Common stable tags: latest, 324-1, 323, etc.
cockpit_image: "quay.io/cockpit/ws"
cockpit_image_tag: "latest"
cockpit_full_image: "{{ cockpit_image }}:{{ cockpit_image_tag }}"

# Network configuration (tailnet-only)
cockpit_port: 9090
cockpit_bind_address: "0.0.0.0"  # Firewall restricts to tailnet

# Storage
# Defaults to /var/lib/cockpit (system default)
# If keystone_storage.ssd_mount is defined, uses custom location
cockpit_config_dir: /etc/cockpit
cockpit_data_dir: "{{ keystone_storage.ssd_mount | default('/var/lib') }}/cockpit"

# Systemd unit
cockpit_systemd_unit: cockpit.service
