---
# tailscale role tasks

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"
  tags: always

- name: Add Tailscale repository (Debian)
  when: ansible_distribution == 'Debian'
  tags: packages
  block:
    - name: Download Tailscale GPG key
      ansible.builtin.get_url:
        url: "{{ tailscale_repo_key_url }}"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: '0644'

    - name: Add Tailscale repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] {{ tailscale_repo_url }}"
        filename: tailscale
        state: present

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

- name: Add Tailscale repository (Fedora)
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_url }}"
    dest: /etc/yum.repos.d/tailscale.repo
    mode: '0644'
  when: ansible_distribution == 'Fedora'
  tags: packages

- name: Install Tailscale
  ansible.builtin.package:
    name: "{{ tailscale_packages }}"
    state: present
  tags: packages

- name: Enable and start Tailscale
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Configure firewalld for tailnet-only access
  when: tailscale_firewall_enabled
  tags: firewall
  block:
    - name: Install firewalld
      ansible.builtin.package:
        name: firewalld
        state: present

    - name: Enable and start firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Set default firewalld zone to drop
      ansible.posix.firewalld:
        zone: drop
        state: enabled
        permanent: true
        immediate: true

    - name: Assign LAN interface to drop zone
      ansible.posix.firewalld:
        zone: drop
        interface: "{{ tailscale_lan_interface }}"
        state: enabled
        permanent: true
        immediate: true

    - name: Check NetworkManager connection zone
      ansible.builtin.command:
        cmd: nmcli -g connection.zone connection show "{{ tailscale_lan_nm_connection }}"
      register: nm_current_zone
      changed_when: false
      failed_when: false

    - name: Set NetworkManager connection zone to drop
      ansible.builtin.command:
        cmd: nmcli connection modify "{{ tailscale_lan_nm_connection }}" connection.zone drop
      when: nm_current_zone.stdout | trim != 'drop'
      notify: Reload NetworkManager connection

    - name: Add Tailscale interface to trusted zone
      ansible.posix.firewalld:
        zone: trusted
        interface: tailscale0
        state: enabled
        permanent: true
        immediate: true

    - name: Allow SSH from Tailscale network
      ansible.posix.firewalld:
        zone: trusted
        service: ssh
        state: enabled
        permanent: true
        immediate: true
      when: tailscale_allow_ssh_from_tailnet

    - name: Allow specific local LAN sources
      ansible.posix.firewalld:
        rich_rule: "rule family='ipv4' source address='{{ item.0.source }}' service name='{{ item.1 }}' accept"
        zone: drop
        state: enabled
        permanent: true
        immediate: true
      loop: "{{ tailscale_allowed_local_sources | subelements('services') }}"
      when: tailscale_allowed_local_sources | length > 0

    - name: Reload firewalld
      ansible.builtin.systemd:
        name: firewalld
        state: reloaded

- name: Note about Tailscale authentication
  ansible.builtin.debug:
    msg: |
      Tailscale is installed but may need authentication.
      Run: sudo tailscale up --accept-routes={{ tailscale_accept_routes }}
      Or provide tailscale_auth_key in vault for unattended setup.
  when: tailscale_status.rc != 0
