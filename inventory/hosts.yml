---
all:
  children:
    keystone_hosts:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
      vars:
        # Platform identifier for OS-specific behavior
        keystone_platform: "{{ 'fedora' if ansible_distribution == 'Fedora' else 'debian' }}"
        
        # Base directories
        keystone_base_dir: /usr/share/keystone
        keystone_config_dir: /etc/keystone
        keystone_state_dir: /var/lib/keystone
        
        # Storage layout (per AGENTS.md contract)
        keystone_storage:
          os_device: /dev/mmcblk0  # eMMC
          ssd_device: /dev/nvme0n1  # M.2 SSD
          backup_devices:
            - /dev/sda  # HDD 1
            - /dev/sdb  # HDD 2
          ssd_mount: /mnt/ssd
          backup_mount: /mnt/backup
        
        # Container runtime
        keystone_container_runtime: podman
        
        # Network
        keystone_tailnet_only: true
