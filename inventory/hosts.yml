---
all:
  children:
    keystone_hosts:
      hosts:
        keystone:
          # Local execution (default): run the playbook directly on the target host.
          # To run remotely via SSH instead, override these in host_vars/keystone.yml:
          #
          #   ansible_host: <ip-or-hostname>   # e.g. 100.x.x.x (Tailscale IP)
          #   ansible_user: <ssh-user>          # e.g. pi
          #   ansible_connection: ssh
          #
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
      vars:
        # Platform identifier for OS-specific behavior
        keystone_platform: "{{ 'fedora' if ansible_distribution == 'Fedora' else 'debian' }}"
        
        # Base directories
        keystone_base_dir: /usr/share/keystone
        keystone_config_dir: /etc/keystone
        keystone_state_dir: /var/lib/keystone
        
        # Container runtime (uses system defaults if no custom storage defined)
        keystone_container_runtime: podman
        
        # Network
        keystone_tailnet_only: true
        
        # Storage configuration (OPTIONAL - only define if you have custom storage)
        # If undefined, system uses standard paths (/var/lib/containers, /var/lib/cockpit)
        # 
        # IMPORTANT: Before enabling custom storage, see docs/STORAGE-SETUP.md
        # - SSD must be manually partitioned before running the playbook
        # - HDDs are used as raw devices (no partitioning required)
        # 
        keystone_storage:
          os_device: /dev/mmcblk0        # eMMC (informational only)
          ssd_device: /dev/nvme0n1p1     # M.2 SSD partition (must exist)
          ssd_mount: /mnt/ssd
          backup_devices:
            - /dev/sda
            - /dev/sdb
          backup_mount: /mnt/backup
