---
all:
  children:
    keystone_hosts:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
      vars:
        # Platform identifier for OS-specific behavior
        keystone_platform: "{{ 'fedora' if ansible_distribution == 'Fedora' else 'debian' }}"
        
        # Base directories
        keystone_base_dir: /usr/share/keystone
        keystone_config_dir: /etc/keystone
        keystone_state_dir: /var/lib/keystone
        
        # Container runtime (uses system defaults if no custom storage defined)
        keystone_container_runtime: podman
        
        # Network
        keystone_tailnet_only: true
        tailscale_allowed_local_sources:
          - source: "192.168.1.244"  # Doorbell camera (cannot join tailnet)
            services:
              - samba
        
        # Storage configuration (OPTIONAL - only define if you have custom storage)
        # If undefined, system uses standard paths (/var/lib/containers, /var/lib/cockpit)
        # 
        # IMPORTANT: Before enabling custom storage, see docs/STORAGE-SETUP.md
        # - SSD must be manually partitioned before running the playbook
        # - HDDs are used as raw devices (no partitioning required)
        # 
        # To enable custom storage, uncomment and configure the section below:
        #
        # keystone_storage:
        #   # Optional: OS device (informational only, not managed by Ansible)
        #   os_device: /dev/mmcblk0
        #   
        #   # SSD for container storage
        #   # MUST be a partition (e.g., /dev/nvme0n1p1), not raw device
        #   # See docs/STORAGE-SETUP.md for partitioning instructions
        #   ssd_device: /dev/nvme0n1p1
        #   ssd_mount: /mnt/ssd
        #   
        #   # RAID backup storage
        #   # Use raw devices (e.g., /dev/sda), not partitions
        #   # Ansible will create RAID1 array automatically
        #   backup_devices:
        #     - /dev/sda
        #     - /dev/sdb
        #   backup_mount: /mnt/backup
